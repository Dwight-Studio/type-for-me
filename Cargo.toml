[package]
name = "type-for-me"
description = "Simple clipboard autotyper"
version = "0.1.0"
edition = "2024"
authors = ["Alexandre Leconte"]
readme = "../README.md"
repository = "https://github.com/Dwight-Studio/type-for-me"
license = "GPL-3"
keywords = ["type", "for", "me", "autotyper", "utility"]
publish = false

[dependencies]
anyhow = "1.0.99"
log = "0.4.27"
fern = { version = "0.7.1", features = ["colored"] }
futures = "0.3.31"
tokio = "1.47.1"
relm4 = { version = "0.10.0-beta.4", features = ["libadwaita", "gnome_47"] }
xkbcommon = "0.9.0"
tr = "0.1.10"
ashpd = { version = "0.12.0", features = ["gtk4"] }
humantime = "2.2.0"
serde = "1.0.219"
toml = "0.9.5"

[build-dependencies]
gvdb = { version = "0.9.0", features = ["gresource"] }